<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trades Dashboard</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 40px 20px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f4f6fa;
      color: #1c2434;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    h1 { margin: 0; font-size: 24px; }

    button {
      background: #3b5bdb;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #2f4ac0; }
    button:disabled { background: #a5b0d6; cursor: not-allowed; }

    .status {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 16px;
      background: #e8ebf3;
      color: #5a6478;
    }
    .status.running { background: #fff3cd; color: #8a6d00; }
    .status.done    { background: #d3f9d8; color: #1b7a2f; }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 1px 3px rgba(20, 30, 60, 0.08);
      overflow: hidden;
    }

    table { width: 100%; border-collapse: collapse; }

    th, td { padding: 12px 18px; text-align: left; }
    th.num, td.num { text-align: right; }

    thead { background: #f8f9fc; }
    th {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #6b7489;
    }

    tbody tr { border-top: 1px solid #eef0f6; }
    tbody tr:hover { background: #f8f9fc; }

    td.id { font-family: ui-monospace, Menlo, Consolas, monospace; color: #6b7489; }
    td.symbol { font-weight: 600; }
    td.num { font-variant-numeric: tabular-nums; }

    .empty { padding: 32px; text-align: center; color: #8a93a6; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Trades Dashboard</h1>
      <button id="btn" onclick="startPull()">Start pull</button>
    </header>

    <div id="status" class="status">Waiting...</div>

    <div class="card">
      <table>
        <thead>
          <tr>
            <th>Trade ID</th>
            <th>Client ID</th>
            <th>Symbol</th>
            <th class="num">Price</th>
            <th class="num">Qty</th>
            <th>Timestamp</th>
          </tr>
        </thead>
        <tbody id="rows">
          <tr><td colspan="6" class="empty">No trades yet</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const statusEl = document.getElementById('status');
    const btn = document.getElementById('btn');

    function setStatus(text, type) {
      statusEl.textContent = text;
      statusEl.className = 'status ' + (type || '');
    }

    async function loadTrades() {
      const res = await fetch('/getTrades');
      const trades = await res.json();
      if (!trades.length) return;

      document.getElementById('rows').innerHTML = trades.map(t => `
        <tr>
          <td class="id">${t.tradeId}</td>
          <td class="id">${t.client}</td>
          <td class="symbol">${t.symbol}</td>
          <td class="num">₹${Number(t.price).toFixed(2)}</td>
          <td class="num">${t.qty}</td>
          <td class="num">${t.timestamp}</td>
        </tr>
      `).join('');
    }

    socket.on('pull:completed', ({ jobId }) => {
      setStatus(`Pull ${jobId} finished`, 'done');
      btn.disabled = false;
      loadTrades();
    });

    async function startPull() {
      btn.disabled = true;
      await fetch('/pulls', { method: 'POST' });
      setStatus('Pull running...', 'running');
    }

    loadTrades();
  </script>
</body>
</html>
